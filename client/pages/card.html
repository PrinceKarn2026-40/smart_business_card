<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Business Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .card {
      background: white;
      border-radius: 28px;
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
    }

    /* ── Header ── */
    .card-top {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      padding: 2.5rem 1.5rem 2rem;
      text-align: center;
    }
    .person-name {
      font-size: 1.75rem;
      font-weight: 800;
      color: white;
      line-height: 1.2;
    }
    .person-title {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.85);
      margin-top: 0.3rem;
    }
    .person-company {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
      margin-top: 0.15rem;
    }

    /* ── Body ── */
    .card-body { padding: 1.75rem 1.5rem; }

    /* ── Call button ── */
    .call-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 1rem;
      background: #28c76f;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 1.5rem;
      transition: opacity 0.2s;
    }
    .call-btn:hover { opacity: 0.9; color: white; }
    .call-btn i { font-size: 1.3rem; }

    /* ── Social Links ── */
    .section-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #adb5bd;
      margin-bottom: 0.875rem;
    }

    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .social-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.875rem 1rem;
      border-radius: 14px;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 700;
      color: white;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .social-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      color: white;
    }
    .social-btn i { font-size: 1.2rem; }

    /* ── Save Contact ── */
    .save-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.875rem;
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .save-btn:hover { opacity: 0.9; }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 3rem;
      color: #6c757d;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #f0f0f0;
      border-top-color: #dc2743;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Not found ── */
    .not-found {
      text-align: center;
      padding: 3rem 2rem;
    }
  </style>
</head>
<body>

<div class="card" id="card">
  <div class="loading">
    <div class="spinner"></div>
    <div>Loading...</div>
  </div>
</div>

<script>
  const PLATFORMS = {
    facebook:  { color: '#1877f2', icon: 'bi-facebook',  label: 'Facebook' },
    instagram: { color: '#e1306c', icon: 'bi-instagram', label: 'Instagram' },
    linkedin:  { color: '#0a66c2', icon: 'bi-linkedin',  label: 'LinkedIn' },
    github:    { color: '#333',    icon: 'bi-github',    label: 'GitHub' },
    tiktok:    { color: '#010101', icon: 'bi-tiktok',    label: 'TikTok' },
    youtube:   { color: '#ff0000', icon: 'bi-youtube',   label: 'YouTube' },
    whatsapp:  { color: '#25d366', icon: 'bi-whatsapp',  label: 'WhatsApp' },
    twitter:   { color: '#000',    icon: 'bi-twitter-x', label: 'X' },
    website:   { color: '#667eea', icon: 'bi-globe',     label: 'Website' },
  };

  const slug = window.location.pathname.split('/card/')[1];

  async function loadCard() {
    try {
      const res = await fetch(`/api/card/${slug}`);
      const data = await res.json();
      if (!data.success) { showNotFound(); return; }
      renderCard(data.data);
    } catch (err) {
      showNotFound();
    }
  }

  function renderCard(c) {
    document.title = `${c.full_name}`;
    window._cardData = c;

    const hasSocials = c.socialLinks && c.socialLinks.length > 0;

    document.getElementById('card').innerHTML = `
      <!-- Name & Title -->
      <div class="card-top">
        <div class="person-name">${c.full_name}</div>
        ${c.job_title ? `<div class="person-title">${c.job_title}</div>` : ''}
        ${c.company   ? `<div class="person-company">${c.company}</div>` : ''}
      </div>

      <div class="card-body">

        <!-- Tap to Call -->
        ${c.phone ? `
          <a href="tel:${c.phone}" class="call-btn">
            <i class="bi bi-telephone-fill"></i> ${c.phone}
          </a>
        ` : ''}

        <!-- Social Links -->
        ${hasSocials ? `
          <div class="section-label">Connect on Social Media</div>
          <div class="social-grid">
            ${c.socialLinks.map(link => {
              const p = PLATFORMS[link.platform] || { color: '#667eea', icon: 'bi-link-45deg', label: link.platform };
              return `
                <a href="${link.url}" target="_blank" class="social-btn" style="background:${p.color};">
                  <i class="bi ${p.icon}"></i> ${p.label}
                </a>`;
            }).join('')}
          </div>
        ` : ''}

        <!-- Save Contact -->
        <button class="save-btn" onclick="downloadVCard()">
          <i class="bi bi-person-plus-fill"></i> Save Contact
        </button>

      </div>
    `;
  }

  function showNotFound() {
    document.getElementById('card').innerHTML = `
      <div class="not-found">
        <div style="font-size:3rem;margin-bottom:1rem;">🪪</div>
        <h4 style="color:#1a1a2e;margin-bottom:0.5rem;">Card Not Found</h4>
        <p style="color:#6c757d;">This business card doesn't exist.</p>
      </div>`;
  }

  function downloadVCard() {
    const c = window._cardData;
    if (!c) return;
    const lines = [
      'BEGIN:VCARD', 'VERSION:3.0',
      `FN:${c.full_name}`,
      c.job_title ? `TITLE:${c.job_title}` : '',
      c.company   ? `ORG:${c.company}` : '',
      c.phone     ? `TEL:${c.phone}` : '',
      c.email     ? `EMAIL:${c.email}` : '',
      c.website   ? `URL:${c.website}` : '',
      'END:VCARD',
    ].filter(Boolean).join('\n');

    const blob = new Blob([lines], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${c.full_name.replace(/\s+/g, '_')}.vcf`;
    a.click();
    URL.revokeObjectURL(url);
  }

  loadCard();
</script>
</body>
</html>
