<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Business Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d1a;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
    }

    .card {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 2rem;
    }

    /* ── Profile Section ── */
    .profile-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 1.5rem;
      position: relative;
    }

    .profile-photo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.2);
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #f09433, #bc1888);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: white;
      overflow: hidden;
    }
    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .person-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: white;
      text-align: center;
      margin-bottom: 0.3rem;
    }

    .person-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-align: center;
    }

    /* ── Links List ── */
    .links-list {
      width: 100%;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 1rem 1.25rem;
      text-decoration: none;
      color: white;
      transition: background 0.2s, transform 0.15s;
      cursor: pointer;
    }
    .link-row:hover {
      background: rgba(255,255,255,0.1);
      transform: scale(1.01);
      color: white;
    }

    .link-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      color: white;
    }

    .link-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: white;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .link-arrow {
      margin-left: auto;
      color: rgba(255,255,255,0.3);
      font-size: 0.9rem;
    }

    /* ── Save Contact ── */
    .save-btn {
      margin: 0.5rem 1.25rem 0;
      width: calc(100% - 2.5rem);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1rem;
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s;
    }
    .save-btn:hover { opacity: 0.9; }

    /* ── Loading ── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: rgba(255,255,255,0.5);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #dc2743;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card" id="card">
  <div class="loading">
    <div class="spinner"></div>
    <div>Loading...</div>
  </div>
</div>

<script>
  const PLATFORMS = {
    facebook:  { color: '#1877f2', icon: 'bi-facebook',  label: 'Facebook' },
    instagram: { color: '#e1306c', icon: 'bi-instagram', label: 'Instagram' },
    linkedin:  { color: '#0a66c2', icon: 'bi-linkedin',  label: 'LinkedIn' },
    github:    { color: '#333',    icon: 'bi-github',    label: 'GitHub' },
    tiktok:    { color: '#010101', icon: 'bi-tiktok',    label: 'TikTok' },
    youtube:   { color: '#ff0000', icon: 'bi-youtube',   label: 'YouTube' },
    whatsapp:  { color: '#25d366', icon: 'bi-whatsapp',  label: 'WhatsApp' },
    telegram:  { color: '#229ed9', icon: 'bi-telegram',  label: 'Telegram' },
    twitter:   { color: '#000',    icon: 'bi-twitter-x', label: 'X (Twitter)' },
    website:   { color: '#667eea', icon: 'bi-globe',     label: 'Website' },
  };

  const slug = window.location.pathname.split('/card/')[1];

  async function loadCard() {
    try {
      const res = await fetch(`/api/card/${slug}`);
      const data = await res.json();
      if (!data.success) { showNotFound(); return; }
      renderCard(data.data);
    } catch (err) {
      showNotFound();
    }
  }

  function initials(name) {
    return (name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }

  function renderCard(c) {
    document.title = c.full_name;
    window._cardData = c;

    const links = [];

    // Phone as first link
    if (c.phone) {
      links.push(`
        <a href="tel:${c.phone}" class="link-row">
          <div class="link-icon" style="background:#28c76f;">
            <i class="bi bi-telephone-fill"></i>
          </div>
          <div class="link-label">Call</div>
          <i class="bi bi-chevron-right link-arrow"></i>
        </a>
      `);
    }

    // WhatsApp if available
    const wa = c.socialLinks?.find(l => l.platform === 'whatsapp');
    if (wa) {
      links.push(`
        <a href="${wa.url}" target="_blank" class="link-row">
          <div class="link-icon" style="background:#25d366;">
            <i class="bi bi-whatsapp"></i>
          </div>
          <div class="link-label">WhatsApp</div>
          <i class="bi bi-chevron-right link-arrow"></i>
        </a>
      `);
    }

    // Other social links (excluding whatsapp already shown)
    if (c.socialLinks) {
      c.socialLinks
        .filter(l => l.platform !== 'whatsapp')
        .forEach(link => {
          const p = PLATFORMS[link.platform] || { color: '#667eea', icon: 'bi-link-45deg', label: link.platform };
          links.push(`
            <a href="${link.url}" target="_blank" class="link-row">
              <div class="link-icon" style="background:${p.color};">
                <i class="bi ${p.icon}"></i>
              </div>
              <div class="link-label">${p.label}</div>
              <i class="bi bi-chevron-right link-arrow"></i>
            </a>
          `);
        });
    }

    // Email
    if (c.email) {
      links.push(`
        <a href="mailto:${c.email}" class="link-row">
          <div class="link-icon" style="background:#dc2743;">
            <i class="bi bi-envelope-fill"></i>
          </div>
          <div class="link-label">Email</div>
          <i class="bi bi-chevron-right link-arrow"></i>
        </a>
      `);
    }

    document.getElementById('card').innerHTML = `
      <div class="profile-section">
        <div class="profile-photo">
          ${c.profile_photo
            ? `<img src="${c.profile_photo}" alt="${c.full_name}">`
            : initials(c.full_name)}
        </div>
        <div class="person-name">${c.full_name}</div>
        ${c.job_title ? `<div class="person-title">${c.job_title}</div>` : ''}
      </div>

      <div class="links-list">
        ${links.join('')}
      </div>

      <button class="save-btn" onclick="downloadVCard()">
        <i class="bi bi-person-plus-fill"></i> Save Contact
      </button>
    `;
  }

  function showNotFound() {
    document.getElementById('card').innerHTML = `
      <div class="loading">
        <div style="font-size:3rem;margin-bottom:1rem;">🪪</div>
        <div style="color:white;font-size:1.1rem;font-weight:700;">Card Not Found</div>
      </div>`;
  }

  function downloadVCard() {
    const c = window._cardData;
    if (!c) return;
    const lines = [
      'BEGIN:VCARD', 'VERSION:3.0',
      `FN:${c.full_name}`,
      c.job_title ? `TITLE:${c.job_title}` : '',
      c.company   ? `ORG:${c.company}` : '',
      c.phone     ? `TEL:${c.phone}` : '',
      c.email     ? `EMAIL:${c.email}` : '',
      c.website   ? `URL:${c.website}` : '',
      'END:VCARD',
    ].filter(Boolean).join('\n');
    const blob = new Blob([lines], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${c.full_name.replace(/\s+/g, '_')}.vcf`;
    a.click();
    URL.revokeObjectURL(url);
  }

  loadCard();
</script>
</body>
</html>
