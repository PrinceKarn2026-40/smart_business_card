<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Business Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card-wrapper {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    /* Header */
    .card-header {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .card-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: white;
      margin-bottom: 0.25rem;
    }
    .card-title {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.85);
      font-weight: 500;
    }
    .card-company {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
      margin-top: 0.15rem;
    }

    /* Body */
    .card-body { padding: 1.5rem; }

    /* Contact rows */
    .section-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #adb5bd;
      margin-bottom: 0.75rem;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid #f8f9fa;
      text-decoration: none;
      color: inherit;
      transition: color 0.15s;
    }
    .contact-row:last-child { border-bottom: none; }
    .contact-row:hover { color: #dc2743; }
    .contact-icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .contact-icon.phone   { background: rgba(40,199,111,0.12);  color: #28c76f; }
    .contact-icon.email   { background: rgba(220,39,67,0.12);   color: #dc2743; }
    .contact-icon.website { background: rgba(255,159,67,0.12);  color: #ff9f43; }
    .contact-icon.address { background: rgba(188,24,136,0.12);  color: #bc1888; }
    .contact-label { font-size: 0.7rem; color: #adb5bd; }
    .contact-value { font-size: 0.9rem; font-weight: 600; color: #1a1a2e; }

    /* Divider */
    .divider {
      height: 1px;
      background: #f0f0f0;
      margin: 1.25rem 0;
    }

    /* Social links */
    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .social-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      color: white;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .social-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
      color: white;
    }
    .social-btn i { font-size: 1.1rem; }

    /* Save contact button */
    .save-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem;
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1.25rem;
      transition: opacity 0.2s;
    }
    .save-btn:hover { opacity: 0.9; }

    /* Not found */
    .not-found {
      text-align: center;
      padding: 3rem 2rem;
      color: #6c757d;
    }
    .not-found h4 { color: #1a1a2e; margin-bottom: 0.5rem; }

    /* Loading */
    .loading {
      text-align: center;
      padding: 3rem;
      color: #6c757d;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #f0f0f0;
      border-top-color: #dc2743;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card-wrapper" id="cardWrapper">
  <div class="loading">
    <div class="spinner"></div>
    <div>Loading...</div>
  </div>
</div>

<script>
  const PLATFORM_STYLES = {
    facebook:  { color: '#1877f2', icon: 'bi-facebook' },
    instagram: { color: '#e1306c', icon: 'bi-instagram' },
    linkedin:  { color: '#0a66c2', icon: 'bi-linkedin' },
    github:    { color: '#333',    icon: 'bi-github' },
    tiktok:    { color: '#010101', icon: 'bi-tiktok' },
    youtube:   { color: '#ff0000', icon: 'bi-youtube' },
    whatsapp:  { color: '#25d366', icon: 'bi-whatsapp' },
    twitter:   { color: '#000',    icon: 'bi-twitter-x' },
    website:   { color: '#667eea', icon: 'bi-globe' },
  };

  const slug = window.location.pathname.split('/card/')[1];

  async function loadCard() {
    try {
      const res = await fetch(`/api/card/${slug}`);
      const data = await res.json();
      if (!data.success) { showNotFound(); return; }
      renderCard(data.data);
    } catch (err) {
      showNotFound();
    }
  }

  function renderCard(c) {
    document.title = `${c.full_name} — Business Card`;
    window._cardData = c;

    const hasContact = c.phone || c.email || c.website || c.address;
    const hasSocials = c.socialLinks && c.socialLinks.length > 0;

    document.getElementById('cardWrapper').innerHTML = `
      <!-- Header -->
      <div class="card-header">
        <div class="card-name">${c.full_name}</div>
        ${c.job_title ? `<div class="card-title">${c.job_title}</div>` : ''}
        ${c.company   ? `<div class="card-company">${c.company}</div>` : ''}
      </div>

      <!-- Body -->
      <div class="card-body">

        <!-- Contact Info -->
        ${hasContact ? `
          <div class="section-label">Contact</div>
          ${c.phone ? `
            <a href="tel:${c.phone}" class="contact-row">
              <div class="contact-icon phone"><i class="bi bi-telephone-fill"></i></div>
              <div><div class="contact-label">Phone</div><div class="contact-value">${c.phone}</div></div>
            </a>` : ''}
          ${c.email ? `
            <a href="mailto:${c.email}" class="contact-row">
              <div class="contact-icon email"><i class="bi bi-envelope-fill"></i></div>
              <div><div class="contact-label">Email</div><div class="contact-value">${c.email}</div></div>
            </a>` : ''}
          ${c.website ? `
            <a href="${c.website}" target="_blank" class="contact-row">
              <div class="contact-icon website"><i class="bi bi-globe"></i></div>
              <div><div class="contact-label">Website</div><div class="contact-value">${c.website.replace(/^https?:\/\//, '')}</div></div>
            </a>` : ''}
          ${c.address ? `
            <div class="contact-row">
              <div class="contact-icon address"><i class="bi bi-geo-alt-fill"></i></div>
              <div><div class="contact-label">Address</div><div class="contact-value">${c.address}</div></div>
            </div>` : ''}
        ` : ''}

        <!-- Social Links -->
        ${hasSocials ? `
          ${hasContact ? '<div class="divider"></div>' : ''}
          <div class="section-label">Connect</div>
          <div class="social-grid">
            ${c.socialLinks.map(link => {
              const style = PLATFORM_STYLES[link.platform] || { color: '#667eea', icon: 'bi-link-45deg' };
              const label = link.platform.charAt(0).toUpperCase() + link.platform.slice(1);
              return `
                <a href="${link.url}" target="_blank" class="social-btn" style="background:${style.color};">
                  <i class="bi ${style.icon}"></i> ${label}
                </a>`;
            }).join('')}
          </div>
        ` : ''}

        <!-- Save Contact -->
        <button class="save-btn" onclick="downloadVCard()">
          <i class="bi bi-person-plus-fill"></i> Save Contact
        </button>

      </div>
    `;
  }

  function showNotFound() {
    document.getElementById('cardWrapper').innerHTML = `
      <div class="not-found">
        <div style="font-size:3rem;margin-bottom:1rem;">🪪</div>
        <h4>Card Not Found</h4>
        <p>This business card doesn't exist or has been removed.</p>
      </div>`;
  }

  function downloadVCard() {
    const c = window._cardData;
    if (!c) return;
    const lines = [
      'BEGIN:VCARD', 'VERSION:3.0',
      `FN:${c.full_name}`,
      c.job_title ? `TITLE:${c.job_title}` : '',
      c.company   ? `ORG:${c.company}` : '',
      c.phone     ? `TEL:${c.phone}` : '',
      c.email     ? `EMAIL:${c.email}` : '',
      c.website   ? `URL:${c.website}` : '',
      c.address   ? `ADR:;;${c.address};;;;` : '',
      'END:VCARD',
    ].filter(Boolean).join('\n');

    const blob = new Blob([lines], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${c.full_name.replace(/\s+/g, '_')}.vcf`;
    a.click();
    URL.revokeObjectURL(url);
  }

  loadCard();
</script>
</body>
</html>
