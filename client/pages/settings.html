<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Smart Business Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="../css/admin.css" rel="stylesheet" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/layout.js"></script>
  <script>Auth.require(); AdminLayout.render('Settings');</script>

  <script>
  const content = document.getElementById('pageContent');
  content.innerHTML = `
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h5 class="fw-bold mb-0" style="color:#1a1a2e;">Settings</h5>
        <small class="text-muted">Manage your admin account</small>
      </div>
    </div>

    <div class="row g-4" style="max-width:600px;">

      <!-- Change Username -->
      <div class="col-12">
        <div class="content-card">
          <div class="content-card-header">
            <h6><i class="bi bi-person me-2 text-primary"></i>Change Username</h6>
          </div>
          <div class="content-card-body">
            <div class="mb-3">
              <label class="form-label fw-semibold">New Username</label>
              <input type="text" id="newUsername" class="form-control" placeholder="Enter new username" />
            </div>
            <button class="btn btn-primary px-4" onclick="changeUsername()">
              <i class="bi bi-check-lg me-2"></i>Update Username
            </button>
          </div>
        </div>
      </div>

      <!-- Change Password -->
      <div class="col-12">
        <div class="content-card">
          <div class="content-card-header">
            <h6><i class="bi bi-lock me-2 text-danger"></i>Change Password</h6>
          </div>
          <div class="content-card-body">
            <div class="mb-3">
              <label class="form-label fw-semibold">Current Password</label>
              <input type="password" id="currentPassword" class="form-control" placeholder="Enter current password" />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">New Password</label>
              <input type="password" id="newPassword" class="form-control" placeholder="Enter new password (min 6 chars)" />
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Confirm New Password</label>
              <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" />
            </div>
            <button class="btn btn-danger px-4" onclick="changePassword()">
              <i class="bi bi-shield-lock me-2"></i>Update Password
            </button>
          </div>
        </div>
      </div>

    </div>
  `;

  // Pre-fill current username
  const admin = Auth.getAdmin();
  if (admin) document.getElementById('newUsername').value = admin.username;

  async function changeUsername() {
    const username = document.getElementById('newUsername').value.trim();
    if (!username) { Toast.show('Please enter a username', 'danger'); return; }

    const res = await API.put('/api/settings/username', { username });
    if (res && res.success) {
      // Update stored admin
      const admin = Auth.getAdmin();
      localStorage.setItem('admin', JSON.stringify({ ...admin, username }));
      Toast.show('Username updated successfully!', 'success');
    } else {
      Toast.show(res?.message || 'Failed to update username', 'danger');
    }
  }

  async function changePassword() {
    const current_password = document.getElementById('currentPassword').value;
    const new_password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (!current_password || !new_password || !confirm) {
      Toast.show('All fields are required', 'danger'); return;
    }
    if (new_password !== confirm) {
      Toast.show('New passwords do not match', 'danger'); return;
    }
    if (new_password.length < 6) {
      Toast.show('Password must be at least 6 characters', 'danger'); return;
    }

    const res = await API.put('/api/settings/password', { current_password, new_password });
    if (res && res.success) {
      Toast.show('Password updated! Please log in again.', 'success');
      document.getElementById('currentPassword').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('confirmPassword').value = '';
      setTimeout(() => Auth.logout(), 2000);
    } else {
      Toast.show(res?.message || 'Failed to update password', 'danger');
    }
  }
  </script>
</body>
</html>
