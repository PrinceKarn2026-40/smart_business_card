<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Smart Business Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="../css/admin.css" rel="stylesheet" />
</head>
<body>

  <!-- Layout injected by layout.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    Auth.require();
    AdminLayout.render('Dashboard');
  </script>

  <script>
    const content = document.getElementById('pageContent');

    content.innerHTML = `
      <!-- Stat Cards -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon purple"><i class="bi bi-people-fill"></i></div>
            <div>
              <div class="stat-value" id="statCustomers">—</div>
              <div class="stat-label">Total Customers</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon green"><i class="bi bi-qr-code-scan"></i></div>
            <div>
              <div class="stat-value" id="statScans">—</div>
              <div class="stat-label">Total Scans</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon orange"><i class="bi bi-person-plus-fill"></i></div>
            <div>
              <div class="stat-value" id="statNew">—</div>
              <div class="stat-label">New This Month</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon red"><i class="bi bi-graph-up-arrow"></i></div>
            <div>
              <div class="stat-value" id="statToday">—</div>
              <div class="stat-label">Scans Today</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Recent Tables -->
      <div class="row g-3">
        <div class="col-12 col-lg-6">
          <div class="content-card">
            <div class="content-card-header">
              <h6><i class="bi bi-people me-2 text-primary"></i>Recent Customers</h6>
              <a href="customers.html" class="btn btn-sm btn-outline-primary" style="font-size:0.75rem;">View All</a>
            </div>
            <div class="content-card-body p-0">
              <table class="table table-hover mb-0">
                <thead>
                  <tr>
                    <th>Customer</th>
                    <th>Company</th>
                    <th>Joined</th>
                  </tr>
                </thead>
                <tbody id="recentCustomersTable">
                  <tr><td colspan="3" class="text-center text-muted py-4">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    `;

    async function loadDashboard() {
      const data = await API.get('/api/dashboard/stats');
      if (!data || !data.success) return;

      const { totalCustomers, totalScans, recentCustomers } = data.data;

      document.getElementById('statCustomers').textContent = totalCustomers;
      document.getElementById('statScans').textContent = totalScans;

      // New this month
      const newThisMonth = recentCustomers.filter(c => {
        const d = new Date(c.created_at);
        const now = new Date();
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      }).length;
      document.getElementById('statNew').textContent = newThisMonth;

      // Scans today
      const today = new Date().toDateString();
      const scansToday = recentScans.filter(s => new Date(s.scanned_at).toDateString() === today).length;
      document.getElementById('statToday').textContent = scansToday;

      // Recent customers table
      const custTbody = document.getElementById('recentCustomersTable');
      if (recentCustomers.length === 0) {
        custTbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted py-4">No customers yet</td></tr>`;
      } else {
        custTbody.innerHTML = recentCustomers.map(c => `
          <tr>
            <td>
              <div class="d-flex align-items-center gap-2">
                ${c.profile_photo
                  ? `<img src="${c.profile_photo}" class="customer-avatar">`
                  : `<div class="customer-avatar">${Format.initials(c.full_name)}</div>`}
                <div>
                  <div class="fw-semibold" style="font-size:0.875rem;">${c.full_name}</div>
                  <div class="text-muted" style="font-size:0.75rem;">${c.job_title || '—'}</div>
                </div>
              </div>
            </td>
            <td class="text-muted">${c.company || '—'}</td>
            <td class="text-muted">${Format.date(c.created_at)}</td>
          </tr>
        `).join('');
      }
    }

    loadDashboard();
  </script>
</body>
</html>
