<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Smart Business Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 1.8rem;
      color: white;
    }
    .form-control {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 10px;
    }
    .form-control:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #dc2743;
      color: #fff;
      box-shadow: 0 0 0 3px rgba(220, 39, 67, 0.25);
    }
    .form-control::placeholder { color: rgba(255,255,255,0.4); }
    .form-label { color: rgba(255,255,255,0.8); font-size: 0.875rem; }
    .btn-login {
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      border: none;
      padding: 0.75rem;
      border-radius: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.9; }
    .btn-login:disabled { opacity: 0.6; }
    .input-group-text {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.5);
      border-right: none;
    }
    .input-group .form-control { border-left: none; }
    .input-group .form-control:focus { border-left: none; }
    #alertBox { display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-icon">
      <i class="bi bi-credit-card-2-front"></i>
    </div>
    <h4 class="text-white text-center fw-bold mb-1">Smart Business Card</h4>
    <p class="text-center mb-4" style="color:rgba(255,255,255,0.5); font-size:0.875rem;">Admin Dashboard</p>

    <div id="alertBox" class="alert alert-danger py-2 px-3 rounded-3" role="alert">
      <i class="bi bi-exclamation-circle me-2"></i><span id="alertMsg"></span>
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" id="username" class="form-control" placeholder="Enter username" required />
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required />
          <button type="button" class="btn btn-outline-secondary border-start-0" id="togglePassword"
            style="background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-login btn-primary w-100 text-white" id="loginBtn">
        <span id="btnText"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</span>
        <span id="btnSpinner" class="d-none">
          <span class="spinner-border spinner-border-sm me-2"></span>Signing in...
        </span>
      </button>
    </form>
  </div>

  <script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', () => {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });

    // If already logged in, redirect to dashboard
    if (localStorage.getItem('token')) {
      window.location.href = '/pages/dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');
      const alertMsg = document.getElementById('alertMsg');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const loginBtn = document.getElementById('loginBtn');

      alertBox.style.display = 'none';

      if (!username || !password) {
        alertMsg.textContent = 'Please enter username and password.';
        alertBox.style.display = 'block';
        return;
      }

      // Show loading
      btnText.classList.add('d-none');
      btnSpinner.classList.remove('d-none');
      loginBtn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('admin', JSON.stringify(data.admin));
          window.location.href = '/pages/dashboard.html';
        } else {
          alertMsg.textContent = data.message || 'Login failed.';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertMsg.textContent = 'Server error. Please try again.';
        alertBox.style.display = 'block';
      } finally {
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
